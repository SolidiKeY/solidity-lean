name: pages

# The examples site (`docs/site.md`): each project is built, its examples are
# opened in Lean's language server and what the server shows is recorded
# (`scripts/site/export.mjs`), and the static viewer in `site/` is published
# with those records. Deploys only from the default branch; on another branch
# (workflow_dispatch) the jobs run and upload the site as an artifact, which
# is how a change to the site is checked before it merges.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# On the default branch a push waits for the build before it rather than
# cancelling it: the core's build outlasts the gap between pushes, so
# cancelling would never let it finish. Elsewhere the newer push wins.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  ide:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LEAN_NUM_THREADS: '1'
      LEAN_BROWSER_WORK: ${{ github.workspace }}/.cache/browser-kernel
      SOLKEY_ROOT: ${{ github.workspace }}/tests/migration/solkey
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the native serialized proof libraries
        uses: leanprover/lean-action@v1
        with:
          build-args: Solidity.Frontend.Testing
          use-mathlib-cache: 'false'
          test: 'false'
          lint: 'false'
      - name: Cache the pinned browser kernel and libraries
        id: kernel
        uses: actions/cache/restore@v4
        with:
          path: .cache/browser-kernel/assets
          key: browser-lean-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'Solidity/**/*.lean', 'web/browser/BrowserFrontend.lean', 'web/browser/bridge.cpp', 'web/tools/lean-wasm/**', 'web/tools/build-lean-browser.sh', 'web/tools/package-lean.mjs') }}
      - name: Build Lean and GMP for WebAssembly
        if: steps.kernel.outputs.cache-hit != 'true'
        run: bash web/tools/build-lean-browser.sh
      # Preserve a completed expensive kernel build even if later UI tests fail.
      # Runtime-source changes produce a different key; broken kernels cannot
      # mask a source fix through this cache.
      - name: Save the compiled kernel before browser validation
        if: steps.kernel.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/browser-kernel/assets
          key: ${{ steps.kernel.outputs.cache-primary-key }}
      - name: Prepare the pinned Solidity compiler
        run: |
          mkdir -p "$SOLKEY_ROOT/keyext.solidity.core/build/soljson"
          curl --fail --location --retry 3 https://raw.githubusercontent.com/ethereum/solc-bin/gh-pages/bin/soljson-v0.8.34+commit.80d5c536.js --output "$SOLKEY_ROOT/keyext.solidity.core/build/soljson/soljson-v0.8.34+commit.80d5c536.js"
      - name: Build the self-contained offline HTML
        env:
          SOLIDITY_BROWSER_LEAN: ${{ github.workspace }}/.cache/browser-kernel/assets
        run: |
          npm ci --prefix web --no-audit --no-fund
          npm run build --prefix web
          npm run build:single --prefix web
          rm -rf web/dist web/.single-file-assets
          node web/test/compression.test.mjs
      - name: Test a fresh offline file launch, proofs and offline reopening
        run: |
          npx --prefix web playwright install --with-deps chromium
          export CHROMIUM_PATH="$(node -p 'require("./web/node_modules/playwright").chromium.executablePath()')"
          node web/test/embedded-assets.cjs
          node --max-old-space-size=192 web/test/website.cjs --single --file --proofs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-ide-test-evidence
          path: |
            web/artifacts/*.json
            web/artifacts/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: site-offline-ide
          path: web/single-file
          if-no-files-found: error

  solidity:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        uses: leanprover/lean-action@v1
        with:
          build-args: "Solidity"
          use-mathlib-cache: "false"
          test: "false"
          lint: "false"
      # solkey's test suite (`SolkeyTestSuite`), whose import, report and
      # proofs are examples too. A failure here is `lean.yml`'s to report: the
      # rest of the core's examples still record, and the suite's pages show
      # what Lean shows.
      - name: Build the TestSuite
        continue-on-error: true
        run: lake build SolkeyTestSuite
      - name: Record the examples
        run: node scripts/site/export.mjs --project Solidity --out _site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-data-solidity
          path: _site
          if-no-files-found: ignore

  velvet:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Velvet's libraries and the examples alone: neither imports the core,
      # so this builds Mathlib's cache, lean-auto, Loom and Velvet only.
      - name: Build Velvet
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: "Bridge"
          build-args: "Velvet VelvetExamples SolidityVelvet"
          use-mathlib-cache: "true"
          test: "false"
          lint: "false"
      - name: Record the examples
        run: node scripts/site/export.mjs --project Velvet --out _site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-data-velvet
          path: _site
          if-no-files-found: ignore

  # The viewer with whatever was recorded: a project whose job failed is
  # shown as not recorded rather than holding back the other.
  # A project whose job failed is published as not recorded; a cancelled run
  # publishes nothing, so it cannot replace the site with an empty project.
  assemble:
    needs: [solidity, velvet, ide]
    if: ${{ !cancelled() && needs.ide.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: site-data-*
          merge-multiple: true
          path: _site
      - uses: actions/download-artifact@v4
        with:
          name: site-offline-ide
          path: _site/ide
      - name: Add the viewer
        run: |
          cp site/index.html site/app.js site/style.css site/examples.json _site/
          touch _site/.nojekyll
          find _site -maxdepth 3 -name index.json -print
      - name: Check the complete Pages deployment budget
        run: |
          python3 - <<'PY'
          from pathlib import Path
          size = sum(p.stat().st_size for p in Path('_site').rglob('*') if p.is_file())
          print(f'Complete Pages site: {size:,} bytes')
          if size >= 1_000_000_000:
              raise SystemExit('The IDE plus examples exceed the GitHub Pages 1 GB site budget')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: assemble
    if: ${{ !cancelled() && needs.assemble.result == 'success' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  check-published-ide:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: site-offline-ide
          path: web/single-file
      - name: Check the deployed single-file website and disconnected proofs
        env:
          SOLIDITY_IDE_URL: ${{ needs.deploy.outputs.page_url }}ide
        run: |
          npm ci --prefix web --no-audit --no-fund
          npx --prefix web playwright install --with-deps chromium
          export CHROMIUM_PATH="$(node -p 'require("./web/node_modules/playwright").chromium.executablePath()')"
          node --max-old-space-size=192 web/test/website.cjs --single --proofs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-ide-test-evidence
          path: |
            web/artifacts/*.json
            web/artifacts/*.png
