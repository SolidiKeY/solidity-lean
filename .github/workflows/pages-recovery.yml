name: replace-failed-pages

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  actions: write

jobs:
  cancel-superseded-failures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const repository = context.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const {data} = await github.rest.actions.listWorkflowRuns({
              ...repository, workflow_id: 'pages.yml', branch,
              status: 'in_progress', per_page: 20
            });
            for (const run of data.workflow_runs) {
              if (run.head_sha === context.sha) continue;
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                ...repository, run_id: run.id, per_page: 100
              });
              if (!jobs.some(job => job.name === 'ide' && job.conclusion === 'failure')) continue;
              // A delayed helper must never cancel a newer push's run.
              const comparison = await github.request('GET /repos/{owner}/{repo}/compare/{basehead}', {
                ...repository, basehead: `${run.head_sha}...${context.sha}`
              });
              if (comparison.data.status !== 'ahead') continue;
              core.info(`Replacing Pages run ${run.id}: its IDE job already failed.`);
              try {
                await github.rest.actions.cancelWorkflowRun({...repository, run_id: run.id});
              } catch (error) {
                if (error.status !== 409) throw error;
                core.info(`Pages run ${run.id} has already finished.`);
              }
            }
