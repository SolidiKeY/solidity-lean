name: lean

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Master: one group per commit, so runs never queue behind each other.
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.sha || github.ref }}
  # Branch and PR runs are superseded by newer pushes; master runs always
  # finish, so every merge gets a verdict.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

# The Lean jobs run in parallel. Each seeds Lake's artifact cache from the
# `lake-cache` release (master's build products, scripts/ci/fetch-lake-cache.sh),
# so a module whose inputs match master is fetched instead of compiled.
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # H107/H112 shrink-only baselines compare all actual merge parents.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Every check of this job lives in one script that `gate.sh` runs too, so a
      # merge that passes the lane gate cannot turn this job red. Lean-free:
      # trust boundaries, site exporter, Dafny inventory, documentation and
      # axiom-pin drift, layering, generated roots and bookkeeping files, the slow
      # example partition and the pinned Solidity feature inventory.
      - name: Fast checks (scripts/ci/checks-fast.sh)
        run: bash scripts/ci/checks-fast.sh

  # Non-blocking until the editor-parity lane makes it pass from a fresh
  # checkout: the full inventory is a checksum-bound bundle kept off git (H44).
  editor-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check editor parity inventory and integration
        run: |
          node vscode/parity/discover.cjs --check
          node vscode/parity/audit.cjs --check
          node --test scripts/check-dafny-features.test.mjs scripts/source-locations.test.mjs vscode/test/*.test.cjs

  # Elaboration is the test suite: there is no separate test driver, and
  # the default library is the whole formalization.
  #
  # use-mathlib-cache is off because there is no Mathlib anywhere on the
  # path: `lakefile.toml` declares no `[[require]]` at all. Keeping it that
  # way is a deliberate invariant (see AGENTS.md).
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          build: "false"
          use-github-cache: "false"
          use-mathlib-cache: "false"
          test: "false"
          lint: "false"
      - name: Seed Lake cache from master
        run: bash scripts/ci/fetch-lake-cache.sh
      - name: Build
        run: lake build Solidity SolidityExamples
      # H109/H134: the slow library stays out of default checkpoints. Each of its
      # modules builds on one core under its own 600 s budget, in import order,
      # so a module that outgrows it is named (scripts/ci/build-slow-examples.sh).
      # The library step below then only checks the root file: the total is
      # bounded per module (H134; user decision 2026-11-10: 600 s per module,
      # the library as a whole may exceed 600 s), not by one library budget.
      - name: Build H109 slow examples, one budget per module
        run: bash scripts/ci/build-slow-examples.sh
      - name: Build H109 slow examples
        env:
          LEAN_NUM_THREADS: '1'
        run: timeout --kill-after=10s 600s lake build SoliditySlowExamples
      # Fetched modules stay in Lake's cache; tools that run Lean themselves
      # need them in .lake/build (scripts/ci/restore-lake-artifacts.py).
      - name: Restore fetched artifacts
        run: python3 scripts/ci/restore-lake-artifacts.py
      # H107/F7: keep inhabited compiler_correct/net/checked applications live.
      - name: Elaborate headline non-vacuity witnesses
        env:
          LEAN_NUM_THREADS: '1'
        run: lake env python3 tests/h28-sol/non-vacuity/kernel.py --all --fresh
      # Every declaration under `Solidity` may use only propext,
      # Classical.choice and Quot.sound; the `unsafe` twins behind
      # `@[implemented_by]` memo helpers, which reach `lcProof` through
      # `unsafeCast`/`unsafeBaseIO`, are exempt by name and any new one fails
      # (`scripts/AxiomAudit.lean`). lean-action's `axiom-audit` applies one
      # allow list to unsafe constants too, so it cannot express this.
      - name: Audit every declaration's axioms
        run: lake env lean --tstack=131072 scripts/AxiomAudit.lean
      - name: Audit headline theorem dependencies
        run: lake env lean --tstack=131072 TrustAudit.lean

  # The automation gate: every TestSuite obligation is derived by the
  # automatic prover (`sol_prove` and the replay `sol_prove?` writes) or
  # refuted by `sol_refute`, and none is pending
  # (`scripts/check-automatic.mjs`).  It reads `Report.lean`'s pin, which
  # the TestSuite build checks.
  testsuite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          build: "false"
          use-github-cache: "false"
          use-mathlib-cache: "false"
          test: "false"
          lint: "false"
      - name: Seed Lake cache from master
        run: bash scripts/ci/fetch-lake-cache.sh
      - name: Build the TestSuite
        run: |
          set -o pipefail
          lake build SolkeyTestSuite 2>&1 | tee testsuite-build.log
      # Fetched modules stay in Lake's cache; tools that run Lean themselves
      # need them in .lake/build (scripts/ci/restore-lake-artifacts.py).
      - name: Restore fetched artifacts
        run: python3 scripts/ci/restore-lake-artifacts.py
      - name: Check fresh replay timing
        run: |
          # GitHub's 4-core runner is slower than the hardware the 300 s budget was set on (H116);
          # CI allows 600 s and records the measured total in memory-loop-ci-replay.json.
          timeout 660s python3 scripts/check-memory-loop-timing.py --budget 600 --output .lake/memory-loop-ci-replay --results memory-loop-ci-replay.json \
            || { for f in .lake/memory-loop-ci-replay/*.log; do echo "== $f"; tail -20 "$f"; done; exit 1; }
      - name: Automation gate
        env:
          REPLAY_BUDGET_S: '600'
        run: node scripts/check-automatic.mjs --strict --build-log testsuite-build.log --replay-group-results memory-loop-ci-replay.json

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          build: "false"
          use-github-cache: "false"
          use-mathlib-cache: "false"
          test: "false"
          lint: "false"
      - name: Seed Lake cache from master
        run: bash scripts/ci/fetch-lake-cache.sh
      - name: Build library and executables
        run: lake build Solidity solidity-lean solkeycheck
      # Fetched modules stay in Lake's cache; tools that run Lean themselves
      # need them in .lake/build (scripts/ci/restore-lake-artifacts.py).
      - name: Restore fetched artifacts
        run: python3 scripts/ci/restore-lake-artifacts.py
      - name: Test source verification and regression suites
        env:
          SOLKEY_ROOT: ${{ github.workspace }}/tests/migration/solkey
          SOLJSON_DIR: ${{ github.workspace }}/tests/migration/solkey/keyext.solidity.core/build/soljson
          LEAN_NUM_THREADS: '1'
        run: |
          mkdir -p "$SOLKEY_ROOT/keyext.solidity.core/build/soljson"
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/ethereum/solc-bin/gh-pages/bin/soljson-v0.8.34+commit.80d5c536.js \
            --output "$SOLKEY_ROOT/keyext.solidity.core/build/soljson/soljson-v0.8.34+commit.80d5c536.js"
          node --test --test-concurrency=1 scripts/preconditions.test.mjs scripts/finite-spec-sets.test.mjs scripts/counterexamples.test.mjs scripts/lex-metrics.test.mjs scripts/source-shadowing.test.mjs scripts/spec-hygiene.test.mjs scripts/filtered-spec-sets.test.mjs
          node --test --test-concurrency=1 scripts/test-solidity.test.mjs scripts/aggregates.test.mjs scripts/declarations-metadata.test.mjs
      - name: Install real backend editor test launcher
        run: npm install --prefix /tmp/solidity-lean-editor-host --no-audit --no-fund @vscode/test-electron@2.5.2
      - name: Test editor with solc and Lean
        env:
          NODE_PATH: /tmp/solidity-lean-editor-host/node_modules
          SOLIDITY_LEAN_NODE_EXECUTABLE: node
          SOLIDITY_LEAN_REAL_BACKEND: ${{ github.workspace }}
          SOLKEY_ROOT: ${{ github.workspace }}/tests/migration/solkey
          LEAN_NUM_THREADS: '1'
        run: |
          node --test --test-concurrency=1 vscode/test/lsp-real.test.cjs vscode/test/project.test.cjs
          xvfb-run -a node vscode/test/run-host.cjs
      - name: Build and test the command line interface
        run: |
          export SOLKEY_ROOT="$RUNNER_TEMP/solidity-cli-solkey"
          cp -a tests/migration/solkey "$SOLKEY_ROOT"
          node --input-type=module <<'JS'
          import {readFileSync, mkdirSync, writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {createHash} from 'node:crypto';
          const root = process.env.SOLKEY_ROOT;
          const gradle = readFileSync(join(root, 'keyext.solidity.core/build.gradle'), 'utf8');
          const file = gradle.match(/ext\.soljsonFile\s*=\s*"([^"]+)"/)[1];
          const sha = gradle.match(/ext\.soljsonSha256\s*=\s*"([0-9a-f]{64})"/)[1];
          const response = await fetch(`https://raw.githubusercontent.com/ethereum/solc-bin/gh-pages/bin/${file}`);
          if (!response.ok) throw new Error(`compiler download: HTTP ${response.status}`);
          const data = Buffer.from(await response.arrayBuffer());
          if (createHash('sha256').update(data).digest('hex') !== sha) throw new Error('compiler hash mismatch');
          const dir = join(root, 'keyext.solidity.core/build/soljson');
          mkdirSync(dir, {recursive:true});
          writeFileSync(join(dir, file), data);
          JS
          lake build solidity-lean solkeycheck
          node --test scripts/solidity-lean.test.mjs scripts/tool-job.test.mjs

  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install editor test launcher
        run: npm install --prefix /tmp/solidity-lean-editor-host --no-audit --no-fund @vscode/test-electron@2.5.2
      - name: Test actual VS Code extension host
        env:
          NODE_PATH: /tmp/solidity-lean-editor-host/node_modules
          SOLIDITY_LEAN_NODE_EXECUTABLE: node
        run: xvfb-run -a node vscode/test/run-host.cjs

  # Bridge/.lake (Mathlib, lean-auto, Loom, Velvet) is the one Actions cache of
  # this workflow. lean-action's own cache saved a new entry on every run of
  # every branch, which filled the repository's 10 GB limit; here only master
  # saves, one entry per commit, and `bridge-cache-evict` deletes the entries
  # of older commits. Branch and pull-request runs restore master's entry
  # read-only.
  bridge:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.bridge-key.outputs.prefix }}${{ github.sha }}
      cache-prefix: ${{ steps.bridge-key.outputs.prefix }}
    steps:
      - uses: actions/checkout@v5
      - name: Bridge cache key
        id: bridge-key
        run: echo "prefix=bridge-lake-${{ runner.os }}-${{ hashFiles('Bridge/lean-toolchain', 'Bridge/lake-manifest.json') }}-" >> "$GITHUB_OUTPUT"
      - name: Restore bridge build cache
        id: bridge-cache
        uses: actions/cache/restore@v4
        with:
          path: Bridge/.lake
          key: ${{ steps.bridge-key.outputs.prefix }}${{ github.sha }}
          restore-keys: ${{ steps.bridge-key.outputs.prefix }}
      - name: Build optional bridge
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: "Bridge"
          use-github-cache: "false"
          use-mathlib-cache: "true"
          test: "false"
          lint: "false"
      - name: Verify pinned reference sources and bridge gate
        run: ./scripts/check-bridge.sh
      - name: Save bridge build cache (master only)
        if: github.ref == 'refs/heads/master' && steps.bridge-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Bridge/.lake
          key: ${{ steps.bridge-key.outputs.prefix }}${{ github.sha }}

  # Runs only on master and executes no code from the build: the one job that
  # may delete caches (`actions: write`).
  bridge-cache-evict:
    needs: bridge
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/ci
      - name: Evict bridge build caches of older commits
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/ci/evict-caches.sh bridge-lake- "${{ needs.bridge.outputs.cache-key }}"
