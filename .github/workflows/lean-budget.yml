name: Lean budget
# Lean size budget ratchet (scripts/lean-budget/check.py, plan step lb-lean-budget):
# frozen areas are shrink-only and each merge has a net-lines cap, unless a commit in
# base..head carries a `Lean-Budget: <step-id>` trailer listed in scripts/lean-budget/allow.json.
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lean-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Self-test
        run: python3 -B scripts/lean-budget/test_check.py
      - name: Budget check
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT" = pull_request ]; then
            base=$(git merge-base HEAD "$PR_BASE")
          elif [ "$REF" = refs/heads/master ]; then
            # merge-base with origin/master is HEAD itself here; compare with the previous master head.
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "$zero" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              base=$BEFORE
            else
              base=$(git rev-parse HEAD^1)
            fi
          else
            base=$(git merge-base HEAD origin/master)
          fi
          python3 -B scripts/lean-budget/check.py --base "$base"
