name: Prose budget
on: [push, pull_request]
permissions:
  contents: read
jobs:
  prose-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts/check-prose-budget-tests
      - run: python3 -B scripts/check-prose-budget --base-ref "$PROSE_BASE"
        env:
          PROSE_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
