name = "solidity-lean"
version = "0.1.0"
defaultTargets = ["Solidity", "solkeycheck"]

[[lean_lib]]
name = "Solidity"
weakLeanArgs = ["--tstack=131072"]

# The ported solkey corpus (`tests/solkey`, generated by
# scripts/solkey-port.mjs). Its own target, and deliberately not imported
# by Solidity.lean: it is a few hundred `sol_wp` proofs, each a
# large simp normalization, so folding it into the default build would
# make every ordinary `./run-lean.sh` pay for the whole parity suite.
# Built by scripts/check-solkey-parity.sh.
[[lean_lib]]
name = "SolidityCorpus"
weakLeanArgs = ["--tstack=131072"]

# The same solkey corpus proved by the rule table alone
# (`Solidity/Corpus/Calculus/`, generated by the same pass of
# scripts/solkey-port.mjs). Its own target for the same reason as
# SolidityCorpus, and a heavier one: each obligation is a few hundred pinned
# taclet applications plus a decided endpoint. Built by
# scripts/check-calculus-parity.sh.
[[lean_lib]]
name = "SolidityCalculus"
weakLeanArgs = ["--tstack=131072"]

# The worked derivations, one `sol_derivation` per worked example of the
# calculus (`Solidity/Paper/`). Its own
# target, and deliberately not imported by Solidity.lean: ~240 pinned rule
# applications, each paying its own simp+decide, cost about 7 minutes of
# CPU, against 24 for the whole default build. The rules themselves are
# already covered by `Examples/Derivations/`, which is in the default
# build. Built by scripts/check-paper.sh.
[[lean_lib]]
name = "SolidityPaper"
weakLeanArgs = ["--tstack=131072"]

# Taclet-text conformance against solkey's `solidityProgramRules.key`.
[[lean_exe]]
name = "solkeycheck"
root = "SolkeyCheck"
