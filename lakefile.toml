name = "solidity-lean"
version = "0.1.0"
defaultTargets = ["Solidity", "solkeycheck"]

[[lean_lib]]
name = "Solidity"
weakLeanArgs = ["--tstack=131072"]

# The ported solkey corpus (`tests/solkey`, generated by
# scripts/solkey-port.mjs). Its own target, and deliberately not imported
# by Solidity.lean: it is a few hundred `sol_wp` proofs, each a
# large simp normalization, so folding it into the default build would
# make every ordinary `./run-lean.sh` pay for the whole parity suite.
# Built by scripts/check-solkey-parity.sh.
[[lean_lib]]
name = "SolidityCorpus"
weakLeanArgs = ["--tstack=131072"]

# The SolSpec specification layer (`Solidity/Spec/`): the assertion
# vocabulary, the `sol_spec` tactic, and the worked obligations of
# `docs/spec-language.md`. Its own target, and deliberately not imported
# by Solidity.lean: the examples are symbolic executions with a large simp
# normalization each, so folding them into the default build would make
# every ordinary `./run-lean.sh` pay for them. Built by
# scripts/check-spec.sh, and by the VS Code extension before it elaborates
# generated obligations.
[[lean_lib]]
name = "SoliditySpec"
weakLeanArgs = ["--tstack=131072"]

# The worked derivations, one `sol_derivation` per construct of the
# calculus (`Solidity/Examples/Derivations/WorkedExamples.lean`). Its own
# target, and deliberately not imported by Solidity.lean: ~240 pinned rule
# applications, each paying its own simp+decide, cost about 30 minutes of
# CPU, against 24 for the whole default build. The rules themselves are
# already covered by `Examples/Derivations/`, which is in the default
# build. Built by scripts/check-examples.sh.
[[lean_lib]]
name = "SolidityExamples"
weakLeanArgs = ["--tstack=131072"]

# Taclet-text conformance against solkey's `solidityProgramRules.key`.
[[lean_exe]]
name = "solkeycheck"
root = "SolkeyCheck"
